      <h1>关于<br>这个画廊</h1>

      <p>Carrycore 是一处安静看市场的角落。它不追逐行情，不制造喧嚣，只用一张张精心挑选的图片，讲清一个关于投资与分析的核心命题。</p>

      <p>每一篇文章都遵循同一个原则：图片是主角，文字是注脚。读完一篇，你可能只记住一幅画面——但那幅画面，就是市场真正的模样。</p>

      <p>这里没有广告，没有弹窗，没有推送。有的只是图像、留白，和屏幕下方低语般的评论。</p>

      <p class="about-sign">—— Carrycore 主理人<br>2026 · 夏</p>
