      <header class="post-head">
        <h1>利率周期：一切估值的起点</h1>
        <time datetime="2026-08-02">2026.08.02</time>
      </header>

      <div class="post-body">
        <p>利率是资产定价的地心引力。低利率时代，资金涌向远方与成长；利率转向，引力回归，估值收缩先于盈利衰退。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="美元与货币，利率之锚"
               width="1920" height="1200" fetchpriority="high">
          <figcaption>货币的供给与价格，是周期的起点。</figcaption>
        </figure>

        <p>理解周期，不是为了预测拐点，而是为了在每一个利率台阶上，重新计算每一类资产的锚。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="数据分析面板"
               width="1920" height="1200" loading="lazy">
          <figcaption>数据不会告诉你方向，但会告诉你位置。</figcaption>
        </figure>

        <p>当无风险收益率抬升，债市、股市、黄金与地产，将以各自的方式重新排队。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="财务图表与建模"
               width="1920" height="1200" loading="lazy">
          <figcaption>把每个假设折现，估值才有锚。</figcaption>
        </figure>
      </div>
