      <header class="post-head">
        <h1>读 K 线：成交量的语言</h1>
        <time datetime="2026-07-19">2026.07.19</time>
      </header>

      <div class="post-body">
        <p>一根 K 线记录一段博弈。开盘、最高、最低、收盘——四笔价格，勾勒出多头与空头一天的攻防。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="K线图"
               width="1920" height="1200" fetchpriority="high">
          <figcaption>形态是表象，量能才是内核。</figcaption>
        </figure>

        <p>形态可以作伪，量能难以说谎。突破需要量确认，衰竭往往伴随缩量新高。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1590650153855-d9e808231d41?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="读盘者"
               width="1920" height="1200" loading="lazy">
          <figcaption>真正读懂市场的，是人，不是屏幕。</figcaption>
        </figure>

        <p>读懂量价，不是预测涨跌，而是听懂市场此刻在说什么。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1543286386-713bdd548da4?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="手绘K线与笔记"
               width="1920" height="1200" loading="lazy">
          <figcaption>经典之所以经典，是因为它先于算法出现。</figcaption>
        </figure>
      </div>
