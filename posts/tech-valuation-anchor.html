      <header class="post-head">
        <h1>科技股的估值之锚</h1>
        <time datetime="2026-06-07">2026.06.07</time>
      </header>

      <div class="post-body">
        <p>成长股的估值，是对未来现金流的一次长距离折现。期限越长，对利率与增速假设的敏感度越高。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="手写分析笔记"
               width="1920" height="1200" fetchpriority="high">
          <figcaption>每一笔估值，最终都要落到纸面上。</figcaption>
        </figure>

        <p>估值不是精确的科学，而是一组假设的排列。真正的锚，是护城河与自由现金流，而非市盈率的数字。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="城市与企业天际线"
               width="1920" height="1200" loading="lazy">
          <figcaption>伟大的公司，从不靠故事维持估值。</figcaption>
        </figure>

        <p>当叙事退潮，只有现金流能托住股价。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1642790106117-e829e14a795f?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="多设备交易终端"
               width="1920" height="1200" loading="lazy">
          <figcaption>市场为梦想定价，也终将为现实买单。</figcaption>
        </figure>
      </div>
