        <h1>黄金：穿越千年的价值锚</h1>
        <time datetime="2026-06-28">2026.06.28</time>
      </header>

      <div class="post-body">
        <p>它不产生利息，不产出股息，却在每一轮危机中被人类重新拾起。因为黄金存储的是比收益更稀缺的东西——信任。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="高山云海日出"
               width="1920" height="1200" fetchpriority="high">
          <figcaption>跨越千年的，是它从未被取代过。</figcaption>
        </figure>

        <p>当实际利率转负、信用扩张见顶，黄金便以最朴素的方式提醒我们：货币的购买力，永远在被稀释。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1574169208507-84376144848b?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="光的流动"
               width="1920" height="1200" loading="lazy">
          <figcaption>光会流动，价值亦然。</figcaption>
        </figure>

        <p>配置黄金，买的不是涨跌，而是一份穿越周期的从容。</p>
      </div>
