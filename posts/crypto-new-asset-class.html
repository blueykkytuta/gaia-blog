      <header class="post-head">
        <h1>加密货币：泡沫还是新资产类别</h1>
        <time datetime="2026-05-16">2026.05.16</time>
      </header>

      <div class="post-body">
        <p>没有现金流，没有财报，只有共识与代码。它是这个时代最昂贵的叙事，也是一场公开的货币实验。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1518546305927-5a555bb7020d?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="比特币"
               width="1920" height="1200" fetchpriority="high">
          <figcaption>一串代码，承载着对中心化货币的全部质疑。</figcaption>
        </figure>

        <p>泡沫与新生资产的边界，往往要到十年之后才清晰。今天能确定的只有波动，与参与者的风险承受力。</p>

        <figure class="post-figure">
          <img src="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1920&h=1200&q=80"
               alt="手机计算与文件"
               width="1920" height="1200" loading="lazy">
          <figcaption>把仓位控制在自己睡得着的范围。</figcaption>
        </figure>

        <p>尊重它的狂热，但永远只投入输得起的钱。</p>
      </div>
