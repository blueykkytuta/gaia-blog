  <main>
    <article class="post">

      <header class="post-head">
        <h1>相对强度表格</h1>
        <time>相对强度时间序列</time>
        <p class="post-sub">选择行业与日期区间，查看相对强度走势</p>
      </header>

      <div class="interactive-wrap">

        <div class="controls trend-controls">
          <div class="trend-dates">
            <div class="datepicker-wrap" id="dp-cur-wrap">
              <button type="button" class="date-picker-btn" id="dp-cur-btn" aria-haspopup="dialog">
                <span class="dp-tag">当前</span><span id="dp-cur-label">–</span><span class="dp-caret">▾</span>
              </button>
            </div>
            <div class="datepicker-wrap" id="dp-his-wrap">
              <button type="button" class="date-picker-btn" id="dp-his-btn" aria-haspopup="dialog">
                <span class="dp-tag dp-tag-ref">历史</span><span id="dp-his-label">–</span><span class="dp-caret">▾</span>
              </button>
            </div>
            <div class="datepicker-pop" id="datepicker-pop" role="dialog" aria-label="选择日期" hidden></div>
          </div>
          <div class="sector-pick">
            <div class="sp-head">
              <span>行业多选</span>
              <button type="button" class="sp-btn" id="sp-all">全选</button>
              <button type="button" class="sp-btn" id="sp-none">清空</button>
              <span id="sp-count" class="count-tag"></span>
            </div>
            <div class="sp-list" id="sp-list"></div>
          </div>
          <!-- 新增筛选 1：最近日期强度数值 -->
          <div class="dualfilter">
            <span>最新强度</span>
            <div class="df-track" id="df-strength"></div>
            <span class="df-values" id="df-strength-values">–</span>
          </div>
          <!-- 新增筛选 2：近3日强弱变化 -->
          <div class="dualfilter">
            <span>近3日变化</span>
            <div class="df-track" id="df-change"></div>
            <span class="df-values" id="df-change-values">–</span>
          </div>

          <button id="btn-replay" class="ctrl-btn" type="button">▶ 重播动画</button>
          <span id="dot-count" class="count-tag"></span>
        </div>

        <div class="trend-datebar" id="trend-datebar">–</div>

        <div class="chart-area">
          <svg id="chart" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-label="相对强度折线图"></svg>
          <div id="tooltip" class="tooltip" role="tooltip"></div>
        </div>

        <div class="trend-legend" id="legend"></div>

        <p class="caption">相对强度 = 行业在全市场中的相对强弱（0~1） · 折线为所选行业在日期区间内的走势 · “最新强度”按最近日期（2026-08-19）的强度筛选，“近3日变化”按该日期对比其前第 3 个有效日期（2026-08-14）的强弱变化筛选 · 数据来自独立数据库"相对强度表"</p>
      </div>

    </article>
  </main>
